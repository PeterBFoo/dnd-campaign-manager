name: dnd-campaign-companion

services:
  edge:
    image: caddy:2.10.2-alpine
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: postgres
      Database__Port: 5432
      Database__Name: ${POSTGRES_DB:-dnd_campaigns}
      Database__User: ${POSTGRES_USER:-dnd_app}
      Database__Password_FILE: /run/secrets/postgres_password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,cloud.provider=oracle_cloud
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_campaigns}
      POSTGRES_USER: ${POSTGRES_USER:-dnd_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-dnd_campaigns}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-dnd_app}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./infra/observability/postgres-exporter.yaml:/postgres_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:?GRAFANA_CLOUD_OTLP_ENDPOINT is required}
    secrets:
      - grafana_cloud_otlp_authorization
    volumes:
      - ./deploy/oci/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./deploy/secrets}/postgres_password
  grafana_cloud_otlp_authorization:
    file: ${SECRETS_DIR:-./deploy/secrets}/grafana_cloud_otlp_authorization

volumes:
  postgres18-data:
  caddy-data:
  caddy-config:
