name: dnd-campaign-companion

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    environment:
      AZURITE_ACCOUNTS: dndlocal:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
    volumes:
      - character-images-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_campaigns}
      POSTGRES_USER: ${POSTGRES_USER:-dnd_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  observability:
    image: grafana/otel-lgtm:0.30.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - observability-data:/data
      - ./infra/observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./infra/observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dnd-campaign.yaml:ro
      - ./infra/observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/dnd-campaign:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-dnd_campaigns}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-dnd_app}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - ./infra/observability/postgres-exporter.yaml:/postgres_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Campaigns: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dnd_campaigns};Username=${POSTGRES_USER:-dnd_app};Password=${POSTGRES_PASSWORD:-local-development-only}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
      Email__Brevo__ApiKey: ${BREVO_API_KEY:-}
      Email__Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-}
      Email__Brevo__SenderName: ${BREVO_SENDER_NAME:-D&D Campaign Manager}
      EventGrid__Enabled: ${EVENTGRID_ENABLED:-false}
      EventGrid__TopicEndpoint: ${EVENTGRID_TOPIC_ENDPOINT:-}
      EventGrid__TenantId: ${EVENTGRID_TENANT_ID:-}
      EventGrid__Audience: ${EVENTGRID_AUDIENCE:-}
      Identity__BootstrapToken: ${IDENTITY_BOOTSTRAP_TOKEN:-local-bootstrap-only-change-before-use}
      Identity__OutboxEncryptionKey: ${OUTBOX_ENCRYPTION_KEY:-}
      Frontend__BaseUrl: http://localhost:4200/
      Database__ApplyMigrations: "true"
      Storage__Characters__ConnectionString: DefaultEndpointsProtocol=http;AccountName=dndlocal;AccountKey=MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=;BlobEndpoint=http://azurite:10000/dndlocal;
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      observability:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tests
    environment:
      ConnectionStrings__Campaigns: Host=postgres-tests;Port=5432;Database=dnd_identity_test;Username=${POSTGRES_USER:-dnd_app};Password=${POSTGRES_PASSWORD:-local-development-only}
      IDENTITY_TEST_DATABASE: Host=postgres-tests;Port=5432;Database=dnd_identity_test;Username=${POSTGRES_USER:-dnd_app};Password=${POSTGRES_PASSWORD:-local-development-only}
      OTEL_SDK_DISABLED: "true"
      Storage__Characters__ConnectionString: DefaultEndpointsProtocol=http;AccountName=dndlocal;AccountKey=MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=;BlobEndpoint=http://azurite:10000/dndlocal;
    depends_on:
      postgres-tests:
        condition: service_healthy
      azurite:
        condition: service_started

  postgres-tests:
    profiles: ["test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dnd_identity_test
      POSTGRES_USER: ${POSTGRES_USER:-dnd_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres18-data:
  observability-data:
  character-images-data:
