{
  "name": "placeholder",
  "resourceGroup": "placeholder",
  "properties": {
    "template": {
      "revisionSuffix": "placeholder",
      "containers": [
        {
          "name": "api",
          "image": "mcr.microsoft.com/dotnet/samples:aspnetapp",
          "resources": {
            "cpu": 0.25,
            "memory": "0.5Gi"
          },
          "env": [
            {
              "name": "ASPNETCORE_ENVIRONMENT",
              "value": "Production"
            },
            {
              "name": "ASPNETCORE_URLS",
              "value": "http://+:8080"
            },
            {
              "name": "ConnectionStrings__Campaigns",
              "secretRef": "database-connection-string"
            },
            {
              "name": "Email__Brevo__ApiKey",
              "secretRef": "brevo-api-key"
            },
            {
              "name": "Email__Brevo__SenderEmail",
              "secretRef": "brevo-sender-email"
            },
            {
              "name": "Email__Brevo__SenderName",
              "value": "D&D Campaign Manager"
            },
            {
              "name": "EventGrid__Enabled",
              "value": "true"
            },
            {
              "name": "EventGrid__TopicEndpoint",
              "value": "https://invalid.example.invalid"
            },
            {
              "name": "EventGrid__TenantId",
              "value": "placeholder"
            },
            {
              "name": "EventGrid__Audience",
              "value": "placeholder"
            },
            {
              "name": "Identity__BootstrapToken",
              "secretRef": "identity-bootstrap-token"
            },
            {
              "name": "Identity__OutboxEncryptionKey",
              "secretRef": "outbox-encryption-key"
            },
            {
              "name": "Database__ApplyMigrations",
              "value": "true"
            },
            {
              "name": "Storage__Characters__ServiceUri",
              "value": "https://invalid.example.invalid"
            },
            {
              "name": "Storage__AdventureCatalog__ServiceUri",
              "value": "https://invalid.example.invalid"
            },
            {
              "name": "Frontend__BaseUrl",
              "value": "https://invalid.example.invalid"
            },
            {
              "name": "Cors__AllowedOrigins__0",
              "value": "https://invalid.example.invalid"
            },
            {
              "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
              "value": "https://invalid.example.invalid/otlp"
            },
            {
              "name": "OTEL_EXPORTER_OTLP_PROTOCOL",
              "value": "http/protobuf"
            },
            {
              "name": "OTEL_EXPORTER_OTLP_HEADERS",
              "secretRef": "grafana-cloud-otlp-headers"
            },
            {
              "name": "OTEL_RESOURCE_ATTRIBUTES",
              "value": "deployment.environment=production,cloud.provider=azure,cloud.platform=azure_container_apps"
            }
          ]
        },
        {
          "name": "postgres-exporter",
          "image": "quay.io/prometheuscommunity/postgres-exporter:v0.20.1",
          "resources": {
            "cpu": 0.25,
            "memory": "0.5Gi"
          },
          "env": [
            {
              "name": "DATA_SOURCE_NAME",
              "secretRef": "postgres-dsn"
            },
            {
              "name": "PG_EXPORTER_COLLECTION_TIMEOUT",
              "value": "30s"
            },
            {
              "name": "PG_EXPORTER_DISABLE_DEFAULT_METRICS",
              "value": "false"
            }
          ]
        },
        {
          "name": "alloy",
          "image": "grafana/alloy:v1.19.2",
          "resources": {
            "cpu": 0.25,
            "memory": "0.5Gi"
          },
          "env": [
            {
              "name": "GRAFANA_CLOUD_OTLP_ENDPOINT",
              "value": "https://invalid.example.invalid/otlp"
            },
            {
              "name": "GRAFANA_CLOUD_AUTHORIZATION",
              "secretRef": "grafana-cloud-authorization"
            }
          ]
        }
      ],
      "scale": {
        "minReplicas": 0,
        "maxReplicas": 1,
        "rules": [
          {
            "name": "http-scaler",
            "http": {
              "metadata": {
                "concurrentRequests": "10"
              }
            }
          }
        ]
      }
    }
  }
}
