name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dnd_identity_test
          POSTGRES_USER: dnd_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_test -d dnd_identity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IDENTITY_TEST_DATABASE: Host=localhost;Port=5432;Database=dnd_identity_test;Username=dnd_test;Password=test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DndCampaign.slnx
      - run: dotnet build DndCampaign.slnx --configuration Release --no-restore
      - run: dotnet test DndCampaign.slnx --configuration Release --no-build --max-parallel-test-modules 1 --minimum-expected-tests 35

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.deploy.yaml config --quiet
      - run: |
          for dashboard in infra/observability/grafana/dashboards/*.json; do
            jq empty "$dashboard"
          done
      - name: Validate production Container App template
        run: |
          rendered_template="$RUNNER_TEMP/container-app-api.yaml"
          AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000 \
          AZURE_RESOURCE_GROUP=dnd-test \
          AZURE_CONTAINER_APP=dnd-campaign-api \
          CONTAINER_APP_REVISION_SUFFIX=app-123456789abc \
          API_IMAGE=ghcr.io/example/api:123456789abc \
          ALLOY_IMAGE=ghcr.io/example/alloy:123456789abc \
          CHARACTER_STORAGE_SERVICE_URI=https://characters.example.invalid/ \
          ADVENTURE_CATALOG_STORAGE_SERVICE_URI=https://adventures.example.invalid/ \
          FRONTEND_ORIGIN=https://frontend.example.invalid \
          FRONTEND_BASE_URL=https://frontend.example.invalid/app/ \
          EVENTGRID_TOPIC_ENDPOINT=https://events.example.invalid/api/events \
          EVENTGRID_TENANT_ID=00000000-0000-0000-0000-000000000000 \
          EVENTGRID_AUDIENCE=api://event-grid-test \
          GRAFANA_CLOUD_OTLP_ENDPOINT=https://grafana.example.invalid/otlp \
          sh scripts/render-container-app-template.sh > "$rendered_template"
          jq --exit-status '
            .properties.template.containers | map(.name) | sort
            == ["alloy", "api", "postgres-exporter"]
          ' "$rendered_template"
          jq --exit-status '
            [.properties.template.containers[].resources.cpu] | add == 0.75
          ' "$rendered_template"
          jq --exit-status '
            .properties.template.scale.minReplicas == 0
            and .properties.template.scale.maxReplicas == 1
            and .properties.template.scale.rules[0].http.metadata.concurrentRequests == "10"
          ' "$rendered_template"
          jq --exit-status '
            .properties.template.containers[]
            | select(.name == "api")
            | .image == "ghcr.io/example/api:123456789abc"
          ' "$rendered_template"
          jq --exit-status '
            .properties.template.containers[]
            | select(.name == "alloy")
            | .image == "ghcr.io/example/alloy:123456789abc"
              and (.env | any(.name == "AZURE_SUBSCRIPTION_ID" and .value == "00000000-0000-0000-0000-000000000000"))
          ' "$rendered_template"
      - name: Validate Alloy configuration
        run: |
          docker build --tag dnd-campaign-alloy:test infra/observability/alloy
          docker run --rm \
            --env GRAFANA_CLOUD_OTLP_ENDPOINT=https://grafana.example/otlp \
            --env 'GRAFANA_CLOUD_AUTHORIZATION=Basic placeholder' \
            dnd-campaign-alloy:test validate /etc/alloy/config.alloy

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/azure fmt -check
      - run: terraform -chdir=infra/azure init -backend=false
      - run: terraform -chdir=infra/azure validate
