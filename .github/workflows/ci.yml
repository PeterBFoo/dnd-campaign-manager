name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dnd_identity_test
          POSTGRES_USER: dnd_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_test -d dnd_identity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IDENTITY_TEST_DATABASE: Host=localhost;Port=5432;Database=dnd_identity_test;Username=dnd_test;Password=test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DndCampaign.slnx
      - run: dotnet build DndCampaign.slnx --configuration Release --no-restore
      - run: dotnet test DndCampaign.slnx --configuration Release --no-build --max-parallel-test-modules 1 --minimum-expected-tests 35

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.deploy.yaml config --quiet
      - run: |
          for dashboard in infra/observability/grafana/dashboards/*.json; do
            jq empty "$dashboard"
          done
      - name: Validate Alloy configuration
        run: |
          docker build --tag dnd-campaign-alloy:test infra/observability/alloy
          docker run --rm \
            --env GRAFANA_CLOUD_OTLP_ENDPOINT=https://grafana.example/otlp \
            --env 'GRAFANA_CLOUD_AUTHORIZATION=Basic placeholder' \
            dnd-campaign-alloy:test validate /etc/alloy/config.alloy

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/azure fmt -check
      - run: terraform -chdir=infra/azure init -backend=false
      - run: terraform -chdir=infra/azure validate
