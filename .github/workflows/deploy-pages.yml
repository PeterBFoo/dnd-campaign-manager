name: deploy-pages

on:
  workflow_run:
    workflows: ["deploy-azure"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch permite seguir lanzándolo manualmente
    # workflow_run solo continúa si deploy-azure terminó correctamente
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure public API endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          printf "window.__DND_CONFIG__ = Object.freeze({ apiBaseUrl: '%s' });\n" "${API_BASE_URL%/}" > apps/web/public/config.js

      - name: Build Angular for project Pages
        run: pnpm --filter @dnd/web exec ng build --base-href /dnd-campaign-manager/

      - name: Add SPA fallback
        run: cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
