name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure public API endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          printf "window.__DND_CONFIG__ = Object.freeze({ apiBaseUrl: '%s' });\n" "${API_BASE_URL%/}" > apps/web/public/config.js
      - name: Build Angular for project Pages
        run: pnpm --filter @dnd/web exec ng build --base-href /dnd-campaign-manager/
      - name: Add SPA fallback
        run: cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
