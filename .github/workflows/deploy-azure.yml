name: deploy-azure

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: peterbfoo/dnd-campaign-api
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps support
        run: az extension add --name containerapp --upgrade

      - name: Deploy immutable API revision
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          API_IMAGE: ghcr.io/peterbfoo/dnd-campaign-api:${{ env.DEPLOY_SHA }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          IDENTITY_BOOTSTRAP_TOKEN: ${{ secrets.IDENTITY_BOOTSTRAP_TOKEN }}
          OUTBOX_ENCRYPTION_KEY: ${{ secrets.OUTBOX_ENCRYPTION_KEY }}
          CHARACTER_STORAGE_SERVICE_URI: ${{ vars.CHARACTER_STORAGE_SERVICE_URI }}
          FRONTEND_ORIGIN: https://peterbfoo.github.io
          FRONTEND_BASE_URL: https://peterbfoo.github.io/dnd-campaign-manager/
          EVENTGRID_TOPIC_ENDPOINT: ${{ vars.EVENTGRID_TOPIC_ENDPOINT }}
          EVENTGRID_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          EVENTGRID_AUDIENCE: ${{ vars.EVENTGRID_AUDIENCE }}
          GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ vars.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          GRAFANA_CLOUD_OTLP_HEADERS: ${{ secrets.GRAFANA_CLOUD_OTLP_HEADERS }}
        run: sh scripts/deploy-azure.sh

      - name: Resolve production endpoint
        id: endpoint
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          fqdn=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)
          printf 'url=https://%s\n' "$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke test production API
        env:
          API_BASE_URL: ${{ steps.endpoint.outputs.url }}
        run: sh scripts/smoke-test-api.sh

      - name: Publish versioned Grafana dashboards
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$GRAFANA_URL"
          test -n "$GRAFANA_SERVICE_ACCOUNT_TOKEN"
          token_file="$RUNNER_TEMP/grafana-service-account-token"
          trap 'rm -f "$token_file"' EXIT
          install -m 600 /dev/null "$token_file"
          printf '%s' "$GRAFANA_SERVICE_ACCOUNT_TOKEN" > "$token_file"
          GRAFANA_TOKEN_FILE="$token_file" sh scripts/publish-grafana-dashboards.sh
