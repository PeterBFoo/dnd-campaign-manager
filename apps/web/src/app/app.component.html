<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Campaign Companion, inicio">
    <span class="brand-mark" aria-hidden="true">D20</span>
    <span><strong>Campaign Companion</strong><small>Una mesa. Dos perspectivas.</small></span>
  </a>
  <nav aria-label="Navegación principal">
    @if (session.user(); as user) {
      @if (user.isPlatformAdmin) { <a routerLink="/admin/invitations">Invitaciones</a> }
      <span>{{ user.displayName }}</span>
      <button type="button" (click)="logout()">Cerrar sesión</button>
    } @else {
      <span class="phase">Acceso por invitación</span>
    }
  </nav>
</header>

<router-outlet />

<footer>
  <span>Angular 22 · ASP.NET Core 10 · PostgreSQL · OpenTelemetry</span>
  <span>Acceso privado y auditable</span>
</footer>
